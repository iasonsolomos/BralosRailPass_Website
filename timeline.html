<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Χρονολόγιο: Σιδηροδρομικό Πέρασμα Μπράλου</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #c0392b;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), #1a252f);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.85;
        }

        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 6px;
            background: repeating-linear-gradient(
                to bottom,
                var(--primary-color),
                var(--primary-color) 15px,
                #7f8c8d 15px,
                #7f8c8d 20px
            );
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -3px;
            border-radius: 3px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease-out;
        }

        .timeline-item.show {
            opacity: 1;
            transform: translateY(0);
        }

        .left {
            left: 0;
        }

        .right {
            left: 50%;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            right: -11px;
            background-color: var(--card-bg);
            border: 4px solid var(--accent-color);
            top: 22px;
            border-radius: 50%;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .right::after {
            left: -11px;
        }

        .timeline-item:hover::after {
            transform: scale(1.3);
            background-color: var(--accent-color);
        }

        .content {
            padding: 20px 25px;
            background-color: var(--card-bg);
            position: relative;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid var(--primary-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .content:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            border-top-color: var(--accent-color);
        }

        .date-badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .content h2 {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .content p {
            font-size: 0.95rem;
            color: #555;
        }

        .extra-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, margin-top 0.4s ease;
            font-size: 0.9rem;
            color: #444;
            border-top: 1px dashed #ddd;
        }

        .content.active .extra-details {
            max-height: 250px;
            margin-top: 12px;
            padding-top: 10px;
        }

        .read-more {
            display: block;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        @media screen and (max-width: 768px) {
            .timeline::after {
                left: 31px;
            }
            .timeline-item {
                width: 100%;
                padding-left: 70px;
                padding-right: 25px;
            }
            .timeline-item::after {
                left: 20px;
            }
            .right {
                left: 0%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Το Σιδηροδρομικό Πέρασμα του Μπράλου</h1>
        <p>Ένα ταξίδι στον χρόνο μέσα από τις 6 καθοριστικές περιόδους της ορεινής χάραξης</p>
    </header>

    <div class="timeline" id="timeline-container"></div>

    <script>
        const timelineData = [
            {
                period: "1901 - 1908",
                title: "Η Μεγάλη Κατασκευή",
                summary: "Η διάνοιξη της ορεινής σιδηροδρομικής γραμμής Πειραιά - Δεμερλή - Συνόρων.",
                details: "Ένα τιτάνιο τεχνικό έργο της εποχής με δεκάδες σήραγγες και εντυπωσιακές μεταλλικές γέφυρες (όπως του Γοργοποτάμου, του Ασωπού και της Παπαδιάς) που συνέδεσε τη Νότια με τη Βόρεια Ελλάδα."
            },
            {
                period: "1917 - 1918",
                title: "Ο Α' Παγκόσμιος Πόλεμος & οι Σύμμαχοι",
                summary: "Στρατηγικός κόμβος ανεφοδιασμού για το Μακεδονικό Μέτωπο.",
                details: "Κατά τον Α' ΠΠ, τα συμμαχικά στρατεύματα της Αντάντ αξιοποίησαν τον σταθμό του Μπράλου ως κύρια βάση μεταφόρτωσης υλικού και στρατευμάτων προς τη Θεσσαλονίκη, κατασκευάζοντας παράλληλα τον οδικό άξονα Μπράλου - Ιτέας."
            },
            {
                period: "1940 - 1944",
                title: "Κατοχή & Εθνική Αντίσταση",
                summary: "Η γραμμή στο επίκεντρο του σαμποτάζ κατά των δυνάμεων του Άξονα.",
                details: "Η ορεινή διάβαση αποτέλεσε στόχο εμβληματικών αντιστασιακών επιχειρήσεων, με κορυφαίες την ανατίναξη της γέφυρας του Γοργοποτάμου (1942) και της γέφυρας του Ασωπού (1943), διακόπτοντας τον ανεφοδιασμό των Γερμανών."
            },
            {
                period: "1944 - 1949",
                title: "Καταστροφές & Ανασυγκρότηση",
                summary: "Η υποχώρηση των Γερμανών, ο Εμφύλιος και η δύσκολη αποκατάσταση.",
                details: "Κατά την αποχώρησή τους το 1944, τα γερμανικά στρατεύματα ανατίναξαν συστηματικά γέφυρες και σήραγγες. Οι εργασίες ανοικοδόμησης καθυστέρησαν λόγω του Εμφυλίου Πολέμου, με τη γραμμή να παραδίδεται ξανά στην κυκλοφορία στα τέλη του 1949."
            },
            {
                period: "1982 - 2018",
                title: "Εκσυγχρονισμός & Νέα Χάραξη",
                summary: "Η μετάβαση από την παλιά ορεινή γραμμή στη σύγχρονη σιδηροδρομική υποδομή.",
                details: "Ξεκίνησαν τα μεγάλα έργα για τη διπλή ηλεκτροκινούμενη γραμμή υψηλών ταχυτήτων Τιθορέα - Λιανοκλάδι - Δομοκός, με τη διάνοιξη της σήραγγας Καλλιδρόμου, που σταδιακά θα υποκαθιστούσε το δύσβατο ορεινό πέρασμα."
            },
            {
                period: "2018 - Σήμερα",
                title: "Τουριστική & Πολιτιστική Αξιοποίηση",
                summary: "Η παράδοση της νέας γραμμής και το μέλλον της ιστορικής διαδρομής.",
                details: "Με την ολοκλήρωση της νέας χάραξης το 2018, η παλιά γραμμή του Μπράλου έπαψε να αποτελεί τον κύριο άξονα. Σήμερα λειτουργεί με τοπικά δρομολόγια, αποτελώντας ένα μοναδικό μνημείο βιομηχανικής αρχαιολογίας και φυσικού κάλλους."
            }
        ];

        const container = document.getElementById('timeline-container');

        timelineData.forEach((item, index) => {
            const side = index % 2 === 0 ? 'left' : 'right';
            
            const timelineItem = document.createElement('div');
            timelineItem.classList.add('timeline-item', side);

            timelineItem.innerHTML = `
                <div class="content" onclick="toggleDetails(this)">
                    <span class="date-badge">${item.period}</span>
                    <h2>${item.title}</h2>
                    <p>${item.summary}</p>
                    <div class="extra-details">
                        <p>${item.details}</p>
                    </div>
                    <span class="read-more">+ Περισσότερα</span>
                </div>
            `;

            container.appendChild(timelineItem);
        });

        function toggleDetails(element) {
            element.classList.toggle('active');
            const span = element.querySelector('.read-more');
            span.textContent = element.classList.contains('active') ? '- Λιγότερα' : '+ Περισσότερα';
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.timeline-item').forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
